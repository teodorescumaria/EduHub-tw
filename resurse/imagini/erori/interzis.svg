<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#FCEBE9" stroke="#BD3A40" stroke-width="4"/>

  <!-- Outer forbidden ring -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="#BD3A40" stroke-width="10"/>

  <!-- Diagonal bar (forbidden sign) -->
  <line x1="57" y1="57" x2="143" y2="143" stroke="#BD3A40" stroke-width="10" stroke-linecap="round"/>

  <!-- Exclamation mark -->
  <rect x="93" y="65" width="14" height="42" rx="6" fill="#781E00"/>
  <circle cx="100" cy="124" r="7" fill="#781E00"/>
</svg>
